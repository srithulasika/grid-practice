<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>viewport</title>
</head>
<body>
    <h1>Viewport</h1>
    <p>The viewport meta tag helps the browser display a webpage according to the device's screen width. It's important for responsive design.</p>
</body>
</html>
